services:
  mysql:
    image: mysql:8.0
    container_name: yakit_lms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: yakit_lms
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - yakit_lms_mysql_data:/var/lib/mysql
      - ./mysql_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  yakit_lms_mysql_data:
